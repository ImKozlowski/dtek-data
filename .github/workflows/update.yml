name: Оновлення графіку ДТЕК

on:
  schedule:
    # Мінімальний інтервал GitHub Actions — 5 хвилин, тут — кожні 20 хвилин
    - cron: '*/20 * * * *'
  workflow_dispatch: # Дозволяє запускати вручну для тестування

permissions:
  contents: write # Дозволяє Action робити коміт згенерованого JSON назад у репозиторій

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Встановлення Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Встановлюємо браузер Chromium та системні бібліотеки для Playwright
          python -m playwright install --with-deps chromium

      - name: Запуск fetch.py
        run: python fetch.py
        env:
          DTEK_CITY: ${{ secrets.DTEK_CITY }}
          DTEK_STREET: ${{ secrets.DTEK_STREET }}

      - name: Коміт та пуш змін
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          # Якщо файл не змінився, commit видасть помилку — ігноруємо її через || true
          git commit -m "Оновлення schedule.json [skip ci]" || true
          git push origin main
